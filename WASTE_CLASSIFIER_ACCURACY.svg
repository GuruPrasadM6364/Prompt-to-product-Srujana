<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">EcoFlow Campus waste classifier accuracy evaluation</title>
  <desc id="desc">Rule-based waste classifier scored 88.2 percent accuracy on a stratified 20 percent holdout of 1,263 labelled benchmark records. Macro F1 was 76.3 percent. E-waste recall was 10 percent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f8f3"/>
      <stop offset="1" stop-color="#e6f1e9"/>
    </linearGradient>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#146b39"/>
      <stop offset="1" stop-color="#28a05a"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #183326; }
      .muted { fill: #5d7065; }
      .small { font-size: 17px; }
      .label { font-size: 19px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="url(#background)"/>
  <rect x="54" y="48" width="1492" height="1104" rx="30" fill="#ffffff" stroke="#d9e7dd" stroke-width="2"/>

  <g transform="translate(98 88)">
    <path d="M35 3C16 3 3 10 0 22c-2 9 5 17 14 15 12-2 21-14 21-25-7 9-14 14-24 18C15 19 23 9 35 3Z" fill="#16803c"/>
    <path d="M10 35c8-9 15-15 24-21" fill="none" stroke="#eaffef" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="145" y="119" font-size="27" font-weight="750" fill="#17683a">EcoFlow Campus</text>
  <text x="98" y="184" font-size="17" font-weight="750" letter-spacing="2.2" fill="#54836a">PROTOTYPE EVALUATION</text>
  <text x="98" y="242" font-size="43" font-weight="760">Waste classifier accuracy</text>
  <text x="98" y="278" font-size="20" class="muted">Existing sensor-threshold rules evaluated against labelled benchmark records</text>

  <rect x="98" y="316" width="1404" height="228" rx="24" fill="#f5faf6" stroke="#dcebe0" stroke-width="2"/>
  <text x="137" y="365" font-size="18" font-weight="700" letter-spacing="1.5" fill="#5d7065">OVERALL ACCURACY</text>
  <text x="137" y="478" font-size="106" font-weight="800" fill="url(#score)">88.2%</text>
  <text x="690" y="392" font-size="20" font-weight="700">Stratified random holdout</text>
  <text x="690" y="429" font-size="19" class="muted">20% held out · 1,263 labelled records</text>
  <text x="690" y="464" font-size="19" class="muted">Seed: 42 · evaluated on the supplied training dataset</text>
  <rect x="690" y="488" width="338" height="1" fill="#dce8df"/>
  <text x="690" y="522" font-size="18" font-weight="700" fill="#17683a">Macro F1: 76.3%</text>
  <text x="1045" y="522" font-size="18" font-weight="700" fill="#17683a">Balanced accuracy: 76.4%</text>

  <text x="98" y="610" font-size="25" font-weight="750">Recall by waste category</text>
  <text x="98" y="640" font-size="16" class="muted">Correct predictions / actual examples in the held-out split</text>
  <text x="1240" y="640" font-size="15" font-weight="700" class="muted">0%</text>
  <text x="1430" y="640" font-size="15" font-weight="700" class="muted">100%</text>

  <g>
    <text x="98" y="696" class="label">Food organic</text>
    <text x="98" y="720" font-size="15" class="muted">356 / 371</text>
    <rect x="420" y="680" width="920" height="22" rx="11" fill="#e7eee9"/>
    <rect x="420" y="680" width="883" height="22" rx="11" fill="#2c9956"/>
    <text x="1370" y="699" font-size="18" font-weight="750">96.0%</text>

    <text x="98" y="759" class="label">Plastic</text>
    <text x="98" y="783" font-size="15" class="muted">323 / 344</text>
    <rect x="420" y="743" width="920" height="22" rx="11" fill="#e7eee9"/>
    <rect x="420" y="743" width="864" height="22" rx="11" fill="#2c9956"/>
    <text x="1370" y="762" font-size="18" font-weight="750">93.9%</text>

    <text x="98" y="822" class="label">Paper / cardboard</text>
    <text x="98" y="846" font-size="15" class="muted">287 / 292</text>
    <rect x="420" y="806" width="920" height="22" rx="11" fill="#e7eee9"/>
    <rect x="420" y="806" width="904" height="22" rx="11" fill="#2c9956"/>
    <text x="1370" y="825" font-size="18" font-weight="750">98.3%</text>

    <text x="98" y="885" class="label">Metal</text>
    <text x="98" y="909" font-size="15" class="muted">81 / 122</text>
    <rect x="420" y="869" width="920" height="22" rx="11" fill="#e7eee9"/>
    <rect x="420" y="869" width="611" height="22" rx="11" fill="#d69b36"/>
    <text x="1370" y="888" font-size="18" font-weight="750">66.4%</text>

    <text x="98" y="948" class="label" fill="#a74432">E-waste</text>
    <text x="98" y="972" font-size="15" fill="#a74432">7 / 70</text>
    <rect x="420" y="932" width="920" height="22" rx="11" fill="#f1e5e2"/>
    <rect x="420" y="932" width="92" height="22" rx="11" fill="#c5523e"/>
    <text x="1370" y="951" font-size="18" font-weight="800" fill="#a74432">10.0%</text>

    <text x="98" y="1011" class="label">Glass</text>
    <text x="98" y="1035" font-size="15" class="muted">60 / 64</text>
    <rect x="420" y="995" width="920" height="22" rx="11" fill="#e7eee9"/>
    <rect x="420" y="995" width="863" height="22" rx="11" fill="#2c9956"/>
    <text x="1370" y="1014" font-size="18" font-weight="750">93.8%</text>
  </g>

  <rect x="98" y="1060" width="1404" height="1" fill="#dce8df"/>
  <text x="98" y="1090" font-size="14" class="muted">Important: heuristic rules, not an ML model. Benchmark results are not a guarantee of real-world or live-campus performance.</text>
  <text x="98" y="1120" font-size="14" class="muted">The separate waste test file is unlabelled and was not used to calculate accuracy. E-waste performance needs improvement.</text>
</svg>
